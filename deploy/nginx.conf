# Student Assistant API reverse proxy — api.ravindertulsiani.com
# HTTPS via Let's Encrypt (see HOSTINGER_DEPLOYMENT_GUIDE.md for certbot).

server {
    listen 80;
    server_name api.ravindertulsiani.com;
    # ACME challenge for certbot
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.ravindertulsiani.com;

    ssl_certificate     /etc/letsencrypt/live/api.ravindertulsiani.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ravindertulsiani.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 30m;   # allow lecture audio / document uploads

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # transcription can take time
        proxy_buffering off;
    }

    location = /api/health {
        proxy_pass http://backend:8001/api/health;
    }
}
